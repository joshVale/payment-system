server:
  port: 8081

spring:
  application:
    name: x-payment-adapter-app

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: xpayment-adapter-consumers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "com.example.xpaymentadapterapp.
        async.XPaymentAdapterRequestMessage"
        spring.json.type.mapping: "xpaymentAdapterRequestMessage:com.example.xpaymentadapterapp.async.XPaymentAdapterRequestMessage"
        metadata.max.age.ms: 300000
        client.dns.lookup: use_all_dns_ips

    listener:
      ack-mode: manual
      concurrency: 1

app:
  kafka:
    topics:
      x-payment-adapter:
        request: xpayment-adapter.requests
        response: xpayment-adapter.responses
        dlt: xpayment-adapter.requests.DLT
  x-payment-provider-api:
    client:
      url: http://localhost:9999
      username: paymentAgentIprody
      password: iprodyTestPassword0123
      account: paymentAgentIprodyApiToken
