databaseChangeLog:
  - changeSet:
      id: 1.3-create-trigger-function
      author: josh
      comment: "Create trigger function to auto-update updated_at"
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION update_updated_at_column()
              RETURNS TRIGGER AS $$
              BEGIN
                 NEW.updated_at = CURRENT_TIMESTAMP;
                 RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
            splitStatements: false
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS update_updated_at_column

  - changeSet:
      id: 1.4-create-trigger
      author: josh
      comment: "Create trigger to update updated_at before update"
      changes:
        - sql:
            sql: CREATE TRIGGER trg_payments_updated_at BEFORE UPDATE ON payments FOR EACH ROW EXECUTE FUNCTION update_updated_at_column()
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_payments_updated_at ON payments