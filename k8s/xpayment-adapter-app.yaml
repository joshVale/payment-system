apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-payment-adapter-app
  labels:
    app: x-payment-adapter-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x-payment-adapter-app
  template:
    metadata:
      labels:
        app: x-payment-adapter-app
    spec:
      containers:
        - name: x-payment-adapter-app
          image: x-payment-adapter-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "my-kafka.db.svc.cluster.local:9092"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq.rabbit.svc.cluster.local"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE
              value: "com.example.xpaymentadapterapp.async.XPaymentAdapterRequestMessage"


